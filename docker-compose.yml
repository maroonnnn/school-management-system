# Runs the whole system with one command:   docker compose up -d --build
# Then open http://localhost:8080
# Secrets come from ./.env (copy .env.docker.example → .env and fill it in).
name: school-management

services:
  db:
    image: postgres:18-alpine        # schema.sql was dumped by pg_dump 18 (uses \restrict)
    restart: unless-stopped
    environment:
      POSTGRES_DB: school_pilot
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env}
    volumes:
      - db-data:/var/lib/postgresql/data
      # run only on the FIRST start (empty volume): schema → reference data → pilot data
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./database/defaults.sql:/docker-entrypoint-initdb.d/02-defaults.sql:ro
      - ./database/seed.sql:/docker-entrypoint-initdb.d/03-seed.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d school_pilot"]
      interval: 5s
      timeout: 5s
      retries: 20

  face:
    build: ./face-service
    restart: unless-stopped
    # no published port: only the backend can reach it

  backend:
    build: ./backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      face:
        condition: service_started
    environment:
      PORT: 5000
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: school_pilot
      DB_USER: postgres
      DB_PASSWORD: ${DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env}
      FACE_KEY: ${FACE_KEY:?set FACE_KEY in .env}
      FACE_SERVICE_URL: http://face:8001
      TRUST_PROXY: "1"
      CORS_ORIGIN: http://localhost:8080
    volumes:
      - uploads:/app/uploads

  frontend:
    build: ./frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "${APP_PORT:-8080}:80"

volumes:
  db-data:
  uploads:
